name: CI

on:
  # No paths-ignore. "CI (Python 3.12)" and "CI (Python 3.13)" are required
  # status checks on main and enforce_admins is on, so any path this workflow
  # skips is a path whose PRs can never merge — the required checks simply
  # never report and nobody, including an admin, can override. A docs-only
  # PR deadlocked exactly this way. Skipping ~3 minutes of CI is not worth
  # an unmergeable PR; if that trade changes, add a companion workflow that
  # reports these same two check names instead of narrowing the trigger.
  #
  # 056-context-file-protection: the matrix dropped "3.11" and gained
  # "3.13" here (airframe-agents>=0.9.2 requires Python>=3.12, matching
  # pyproject.toml's requires-python bump). Branch protection's required
  # status checks list the *old* names ("CI (Python 3.11)" / "CI (Python
  # 3.12)") — a repo admin must update that list to "CI (Python 3.12)" /
  # "CI (Python 3.13)" or PRs may be unmergeable until they do.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install jj (Jujutsu)
        # The spec-chain integration tests build a real jj-colocated repo
        # and exercise genuine `jj workspace` behavior, so they need the
        # actual binary (other suites mock JjClient). Pinned to match the
        # dev container's jujutsu feature.
        env:
          JJ_VERSION: v0.43.0
        run: |
          curl -fsSL \
            "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/jj.tar.gz
          tar -xzf /tmp/jj.tar.gz -C /tmp ./jj
          sudo install -m 0755 /tmp/jj /usr/local/bin/jj
          jj --version

      - name: Install ripgrep
        # Spec Kit ingestion *generates* `rg --files -g '<path>'` verification
        # commands that fly's AC check later executes, so rg is a de-facto
        # runtime dependency of that path. One test runs an emitted command
        # for real to prove the no-file-scope fallback is satisfiable — the
        # defect that once drove the fixer to fabricate a file to match an
        # unmatchable glob. It skips without rg, so CI must supply it or that
        # regression could land green.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Run CI checks (lint, typecheck, test)
        run: make ci-coverage

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Test Report
        # Skip on dependabot PRs — the bot's GITHUB_TOKEN is restricted
        # to read-only by GitHub for security, so dorny/test-reporter's
        # check-creation call returns HTTP 403 and the action errors out
        # even though tests passed. Human PRs still get the rich report.
        uses: dorny/test-reporter@v3
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: "results.xml"
          reporter: "java-junit"
          fail-on-error: false
